<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Success Page</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="min-h-screen bg-gradient-to-br from-green-100 via-white to-blue-100 flex items-center justify-center"
  >
    <div class="w-full max-w-md px-4">
      <div class="bg-white rounded-2xl shadow-xl p-8 text-center">
        <!-- Success Icon -->
        <div
          class="mx-auto mb-5 flex items-center justify-center w-20 h-20 rounded-full bg-green-100"
        >
          <span class="text-5xl text-green-600">✓</span>
        </div>
        <!-- Heading -->
        <h2 class="text-3xl font-bold text-green-600 mb-3">
          OTP Verified Successfully!
        </h2>
        <!-- Message -->
        <p class="text-gray-600 text-lg">
          Your email has been verified successfully.
        </p>
        <p class="text-gray-400 text-sm mt-3">
          Thank you for verifying your email address.
        </p>
        <!-- Button -->
        <a
          href="#"
          class="inline-block mt-7 px-6 py-3 bg-green-600 hover:bg-green-700 text-white font-semibold rounded-lg transition duration-300 shadow-md hover:shadow-lg"
        >
          Continue
        </a>
      </div>
    </div>
  </body>
</html>
