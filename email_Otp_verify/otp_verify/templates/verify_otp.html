<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-blue-100 via-white to-purple-100 flex items-center justify-center">

    <div class="w-full max-w-md px-4">

        <div class="bg-white rounded-2xl shadow-xl p-8">

            <!-- Heading -->
            <div class="text-center mb-8">
                <h2 class="text-3xl font-bold text-gray-800">
                    Verify OTP
                </h2>

                <p class="text-gray-500 mt-2">
                    Enter the OTP sent to your email
                </p>
            </div>

            <!-- Error Message -->
            {% if error %}
                <div class="mb-5 p-3 rounded-lg bg-red-100 border border-red-300 text-red-700 text-center">
                    {{ error }}
                </div>
            {% endif %}

            <!-- Form -->
            <form method="POST" class="space-y-5">

                {% csrf_token %}

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Enter OTP
                    </label>

                    <input
                        type="text"
                        name="otp"
                        placeholder="Enter 6-digit OTP"
                        maxlength="6"
                        required
                        class="w-full px-4 py-3 text-center text-xl tracking-[0.5em]
                               border border-gray-300 rounded-lg
                               focus:outline-none focus:ring-2 focus:ring-blue-500
                               focus:border-blue-500 transition"
                    >
                </div>

                <button
                    type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700
                           text-white font-semibold py-3 rounded-lg
                           transition duration-300 shadow-md hover:shadow-lg"
                >
                    Verify OTP
                </button>

            </form>

            <!-- Security Message -->
            <p class="text-center text-sm text-gray-500 mt-6">
                🔒 Never share your OTP with anyone.
            </p>

        </div>

    </div>

</body>
</html>
