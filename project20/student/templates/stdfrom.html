
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-blue-100 via-purple-100 to-pink-100 flex items-center justify-center p-5">
    <!-- Main Card -->
    <div class="w-full max-w-lg bg-white/90 backdrop-blur-lg shadow-2xl rounded-3xl p-8">
        <!-- Heading -->
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold text-gray-800">
                Welcome to Registration Form
            </h2>
            <p class="text-gray-500 mt-2">
                Please fill in your details below
            </p>
        </div>
        <!-- Form -->
        <form action="{% url 'addstd' %}" method="post" class="space-y-5">
            {% csrf_token %}
            <!-- Name -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">
                    Name
                </label>
                <input
                    type="text"
                    name="name"
                    placeholder="Enter your name"
                    required
                    class="w-full px-4 py-3 rounded-xl border border-gray-300
                           focus:outline-none focus:ring-2 focus:ring-blue-500
                           focus:border-blue-500 transition duration-300"
                >
            </div>

            <!-- Email -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                    class="w-full px-4 py-3 rounded-xl border border-gray-300
                           focus:outline-none focus:ring-2 focus:ring-purple-500
                           focus:border-purple-500 transition duration-300"
                >
            </div>

            <!-- Age -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">
                    Age
                </label>

                <input
                    type="number"
                    name="age"
                    placeholder="Enter your age"
                    min="1"
                    max="100"
                    required
                    class="w-full px-4 py-3 rounded-xl border border-gray-300
                           focus:outline-none focus:ring-2 focus:ring-pink-500
                           focus:border-pink-500 transition duration-300"
                >
            </div>
            <!-- City -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">
                    City
                </label>
                <input
                    type="text"
                    name="city"
                    placeholder="Enter your city"
                    required
                    class="w-full px-4 py-3 rounded-xl border border-gray-300
                           focus:outline-none focus:ring-2 focus:ring-green-500
                           focus:border-green-500 transition duration-300"
                >
            </div>

            <!-- Submit Button -->
            <button
                type="submit"
                name="sub"
                class="w-full py-3 mt-3 rounded-xl
                       bg-gradient-to-r from-blue-600 to-purple-600
                       text-white font-bold text-lg
                       hover:from-purple-600 hover:to-pink-600
                       hover:scale-[1.02]
                       active:scale-95
                       transition-all duration-300
                       shadow-lg cursor-pointer"
            >
                Register
            </button>

        </form>

    </div>

</body>
</html>
