{% extends "employe/base.html" %}

{% block content %}

<div class="flex justify-center items-center min-h-[60vh]">

    <div class="w-full max-w-md bg-blue-200 rounded shadow-xl p-8">

        <!-- Heading -->
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">
            Employe Detail
        </h1>
        <div class="space-y-4">

            <div class="bg-gray-100 rounded p-2">
                <p class="text-sm text-gray-500">Name</p>
                <p class="text-lg font-bold text-gray-800">
                    {{ employe.name }}
                </p>
            </div>

            <div class="bg-gray-100 rounded p-2">
                <p class="text-sm text-gray-500">Email</p>
                <p class="text-lg font-medium text-gray-800">
                    {{ employe.email }}
                </p>
            </div>

            <div class="bg-gray-100 rounded p-2">
                <p class="text-sm text-gray-500">Age</p>
                <p class="text-lg font-bold text-gray-800">
                    {{ employe.age }}
                </p>
            </div>

        </div> 
        <div class="mt-6 text-center">

            <a href="{% url 'employe:emp_list' %}"
               class="inline-block bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg transition">
                ← Back to List
            </a>

        </div>

    </div>

</div>

{% endblock content %}
