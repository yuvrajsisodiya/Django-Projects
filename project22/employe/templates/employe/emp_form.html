{% extends "employe/base.html" %}

{% comment %}
Employee create page
{% endcomment %}

{% block content %}
 {% if employe %}
        <h1 class="text-2xl font-bold mb-4 text-red-500">Update Employe</h1>
    {% else %}
        <h1 class="text-2xl font-bold mb-4">Add Employe</h1>
    {% endif %}



<form method="POST">

    {% csrf_token %}

    {{ form.as_p }}

    <button
        class="bg-blue-500 hover:bg-blue-700 text-white font-bold mt-5 py-2 px-4 rounded"
        type="submit">
           {% if employe %}
                Update Employe
            {% else %}
                Create Employe
            {% endif %}
    </button>

    <a
        href="{% url 'employe:emp_list' %}"
        class="bg-gray-500 hover:bg-gray-700 text-white font-bold mt-5 py-2 px-4 rounded">
        Cancel
    </a>

</form>

{% endblock %}
