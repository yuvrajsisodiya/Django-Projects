{% extends "employe/base.html" %} 
{% block content %}

<div class="flex justify-center items-center min-h-[60vh]">
  <div class="bg-white shadow-xl rounded-2xl p-10 text-center max-w-md w-full">
    <div class="text-green-500 text-6xl mb-4">✓</div>

    <h2 class="text-3xl font-bold text-green-600 mb-3">Employee Added Successfully!</h2>

    <p class="text-gray-600 mb-6"> The employee has been added successfully to the system. </p>

    <div class="flex justify-center gap-5">
      <a
        href="{% url 'employe:emp_list' %}"
        class="bg-blue-500 hover:bg-blue-700 text-white font-semibold px-5 py-2 rounded-lg">
        Employee List </a>

      <a
        href="{% url 'employe:emp_create' %}"
        class="bg-green-500 hover:bg-green-700 text-white font-semibold px-5 py-2 rounded-lg" >
        Add Another  </a>
    </div>
  </div>
</div>

{% endblock content %}
