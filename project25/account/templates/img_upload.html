{% extends "base.html" %}

{% block title %}
Upload Image
{% endblock title %}

{% block content %}

<div class="max-w-xl mx-auto">

    <!-- Heading -->
    <div class="text-center mb-8">

        <div class="text-5xl mb-3">
            📤
        </div>

        <h2 class="text-3xl font-bold text-gray-800">
            Upload Image
        </h2>

        <p class="text-gray-500 mt-2">
            Upload a student image using the form below.
        </p>

    </div>


    <!-- Upload Card -->
    <div class="bg-white rounded-2xl shadow-xl p-8">

        <form method="post"
              enctype="multipart/form-data"
              class="space-y-6">

            {% csrf_token %}

            <!-- Django Form -->
            <div class="space-y-4">

                {{ form.as_p }}

            </div>


            <!-- Button -->
            <button
                type="submit"
                class="w-full bg-indigo-600 text-white
                       py-3 rounded-lg font-semibold text-lg
                       hover:bg-indigo-700
                       active:scale-95
                       transition duration-200">

                ⬆ Upload Image

            </button>

        </form>

    </div>


    <!-- Back Button -->
    <div class="text-center mt-6">

        <a href="{% url 'display_files' %}"
           class="text-indigo-600 font-semibold hover:underline">

            ← View Uploaded Images

        </a>

    </div>

</div>

{% endblock content %}
