{% extends "base.html" %}

{% block title %}
Delete Post
{% endblock title %}

{% block content %}

<div class="min-h-[70vh] flex items-center justify-center">

    <div class="bg-white w-full max-w-md p-8 rounded-2xl shadow-xl text-center">

        <!-- Icon -->
        <div class="text-5xl mb-4">
            🗑️
        </div>

        <h2 class="text-2xl font-bold text-gray-800 mb-3">
            Delete Post?
        </h2>

        <p class="text-gray-600 mb-2">
            Are you sure you want to delete this post?
        </p>

        <h3 class="text-lg font-semibold text-gray-800 mb-6">
            "{{ post.title }}"
        </h3>

        <!-- Buttons -->
        <div class="flex justify-center gap-3">

            <a
                href="{% url 'post_list' %}"
                class="px-5 py-2 bg-gray-200 text-gray-700 rounded-lg font-semibold hover:bg-gray-300 transition"
            >
                Cancel
            </a>

            <form method="post">
                {% csrf_token %}

                <button
                    type="submit"
                    class="px-5 py-2 bg-red-600 text-white rounded-lg font-semibold hover:bg-red-700 transition"
                >
                    🗑️ Yes, Delete
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock content %}
