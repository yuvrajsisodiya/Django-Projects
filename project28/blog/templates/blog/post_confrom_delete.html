<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>delete confrom</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-md">
      <!-- Card -->
      <div class="bg-white rounded-2xl shadow-xl border border-gray-200 p-8">
        <!-- Heading -->
        <h1 class="text-3xl font-bold text-red-600 text-center mb-5">
          Confirm Delete
        </h1>
        <!-- Message -->
        <p class="text-gray-600 text-center text-lg mb-6">
          Are you sure you want to delete Post
          <span class="font-bold text-gray-800"> "{{ post.title }}" </span> ?
        </p>
        <!-- Warning -->
        <div class="bg-red-50 border border-red-200 rounded-lg p-4 mb-6">
          <p class="text-sm text-red-600 text-center">
            ⚠️ This action cannot be undone.
          </p>
        </div>
        <!-- Form -->
        <form method="post">
          {% csrf_token %}
          <div class="flex gap-3">
            <!-- Delete Button -->
            <button
              type="submit"
              class="flex-1 bg-red-600 hover:bg-red-700 text-white font-semibold px-5 py-3 rounded-lg shadow-md hover:shadow-lg transition duration-200"
            >
              Yes, Delete
            </button>
            <!-- Cancel Button -->
            <a
              href="{% url 'post_detail' post.pk %}"
              class="flex-1 text-center bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold px-5 py-3 rounded-lg transition duration-200"
            >
              Cancel
            </a>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
