<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Post Form</title>

    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-gray-100 min-h-screen">
    <div class="max-w-xl mx-auto mt-10">
      <!-- Heading -->
      {% if post %}
      <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">
        Edit Post
      </h1>
      {% else %}
      <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">
        Create Post
      </h1>
      {% endif %}

      <!-- Form Card -->
      <div class="bg-white p-8 rounded-2xl shadow-lg border border-gray-200">
        <form method="post" class="space-y-5">
          {% csrf_token %}

          <div class="space-y-4">{{ form.as_p }}</div>
          <!-- Buttons -->
          <div class="flex items-center gap-3 pt-2">
            <button
              type="submit"
              class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-2.5 rounded-lg transition duration-200"
            >
              {% if post %} Update 
              {% else %} Create 
              {% endif %}
            </button>

            <a
              href="{% url 'post_list' %}"
              class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold px-6 py-2.5 rounded-lg transition duration-200"
            >
              Back
            </a>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
