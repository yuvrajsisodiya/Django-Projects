<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Post List</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>


<body class="bg-gray-100 min-h-screen">


    <!-- ================= NAVBAR ================= -->

    <nav class="bg-white shadow-md border-b border-gray-200 sticky top-0 z-50">

        <div class="max-w-6xl mx-auto px-6 py-4">

            <div class="flex items-center justify-between">

                <!-- Application Name -->

                <a
                    href="{% url 'post_list' %}"
                    class="text-2xl font-extrabold text-gray-800"
                >
                    Blog Application
                </a>


                <!-- Create Post -->

                <a
                    href="{% url 'post_create' %}"
                    class="bg-blue-600 hover:bg-blue-700
                           text-white font-semibold
                           px-5 py-2.5 rounded-lg
                           shadow-md hover:shadow-lg
                           transition duration-300"
                >
                    + Create Post
                </a>

            </div>

        </div>

    </nav>



    <!-- ================= MAIN CONTAINER ================= -->

    <main class="max-w-5xl mx-auto px-5 sm:px-8 py-10">


        <!-- ================= PAGE HEADING ================= -->

        <div class="mb-8">

            <h1 class="text-4xl font-bold text-gray-800">
                Post List
            </h1>

            <p class="text-gray-500 mt-2">
                Explore all available posts
            </p>

        </div>



        <!-- ================= POST LIST ================= -->

        <ul class="space-y-5">


            {% for post in posts %}

            <!-- Post Card -->

            <li
                class="bg-white rounded-xl
                       border border-gray-200
                       shadow-md
                       hover:shadow-xl
                       p-6
                       transition duration-300"
            >

                <div class="flex flex-col sm:flex-row
                            sm:items-center
                            sm:justify-between
                            gap-4">


                    <!-- Post Information -->

                    <div>

                        <h2
                            class="text-2xl font-bold
                                   text-gray-800
                                   hover:text-blue-600
                                   transition"
                        >
                            {{ post.title }}
                        </h2>

                        <p class="text-gray-500 mt-2">
                            Blog Post
                        </p>

                    </div>


                    <!-- More Details -->

                    <a
                        href="{% url 'post_detail' post.pk %}"
                        class="inline-flex items-center
                               justify-center gap-2
                               bg-blue-600
                               hover:bg-blue-700
                               text-white font-semibold
                               px-5 py-2.5
                               rounded-lg
                               transition duration-300"
                    >
                        More Details
                        <span>→</span>
                    </a>
                </div>
            </li>
            {% empty %}
            <!-- ================= EMPTY STATE ================= -->

            <li
                class="bg-white rounded-xl
                       border border-gray-200
                       shadow-md
                       p-10 text-center"
            >
                <div class="text-5xl mb-4">
                    📝
                </div>

                <h2 class="text-2xl font-bold text-gray-700">
                    No Posts Available
                </h2>

                <p class="text-gray-500 mt-2 mb-6">
                    Start by creating your first blog post.
                </p>
                <a
                    href="{% url 'post_create' %}"
                    class="inline-block
                           bg-blue-600 hover:bg-blue-700
                           text-white font-semibold
                           px-6 py-3
                           rounded-lg
                           transition"
                >
                    Create Post
                </a>
            </li>
            {% endfor %}
        </ul>

    </main>


</body>
</html>
