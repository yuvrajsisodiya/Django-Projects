{% extends "base.html" %}

{% block content %}
{% if student %}
<h1 class="text-xl font-bold mb-4 text-green-400">Edit Student</h1>
{% else %}
<h1 class="text-2xl font-bold mb-4">Add Student</h1>
{% endif %}
    {% if error_msg %}
    <p class="text-red-500 mb-4">{{ error_msg }}</p>
{% endif %}
    <form method="post"  class="bg-blue-100 shadow-md rounded px-8 pt-6 pb-8 mb-4">
        {% csrf_token %}
        <div class="mb-3 ">
            <label for="name" class="block text-gray-700 font-bold mb-2">Name</label>
            <input type="text" value="{{ student.name }}" class=" w-full border-2 border-gray-300 rounded py-2 px-3"  name="name">
        </div>
        <div class="mb-3">
            <label for="course" class="block text-gray-700 font-bold mb-2">Course</label>
            <input type="text" value="{{ student.course }}" class=" w-full border-2 border-gray-300 rounded py-2 px-3  "  name="course">
        </div>
        <div class="mb-3">
            <label for="email" class="block text-gray-700 font-bold mb-2">Email</label>
            <input type="email" value="{{ student.email }}" class=" w-full border-2 border-gray-300 rounded py-2 px-3 "  name="email">
        </div>
        <div class="mb-3">
            <label for="age" class="block text-gray-700 font-bold mb-2">Age</label>
            <input type="number" value="{{ student.age }}" class=" w-full border-2 border-gray-300 rounded py-2 px-3   " name="age">
        </div>
        <div class="mb-3">
            <label for="mob" class="block text-gray-700 font-bold mb-2">Mobile</label>
            <input type="number" value="{{ student.mob }}" class=" w-full border-2 border-gray-300 rounded py-2 px-3   " name="mob">
        </div>
        <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">Save</button>
        <a href="{% url 'studentapp:std_list' %}" class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded ml-2">Cancel</a>
    </form>
{% endblock %}
