{% extends "base.html" %}
{% block content %}
    <h1 class="text-2xl font-bold mb-4">Add Student</h1>
    <form method="post" action="{% url 'studentapp:std_list' %}" class="bg-blue-100 shadow-md rounded px-8 pt-6 pb-8 mb-4">
        {% csrf_token %}
        <div class="mb-3 ">
            <label for="name" class="block text-gray-700 font-bold mb-2">Name</label>
            <input type="text" class=" w-full border-2 border-gray-300 rounded py-2 px-3"  name="name">
        </div>
        <div class="mb-3">
            <label for="course" class="block text-gray-700 font-bold mb-2">Course</label>
            <input type="text" class=" w-full border-2 border-gray-300 rounded py-2 px-3  "  name="course">
        </div>
        <div class="mb-3">
            <label for="email" class="block text-gray-700 font-bold mb-2">Email</label>
            <input type="email" class=" w-full border-2 border-gray-300 rounded py-2 px-3 "  name="email">
        </div>
        <div class="mb-3">
            <label for="age" class="block text-gray-700 font-bold mb-2">Age</label>
            <input type="number" name="age" class=" w-full border-2 border-gray-300 rounded py-2 px-3   ">
        </div>
        <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">Save</button>
        <a href="{% url 'studentapp:std_list' %}" class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded ml-2">Cancel</a>
    </form>
{% endblock %}
