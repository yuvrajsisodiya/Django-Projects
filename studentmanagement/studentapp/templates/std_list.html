{% extends "base.html" %}
{% block content %} 
<h2 class="text-2xl font-bold mb-4 ">Student List</h2>
<table class=" w-full mt-5 border-separate border-spacing-y-1.5">
    <thead>
        <tr class="">
            <th class="px-20 text-2xl py-3 text-start">Name</th>
             <th class="px-20 text-2xl py-3 text-start">Addmition Date</th>
            
        </tr>
    </thead>
    <tbody>
        {% for student in students %}
        <tr class="bg-gray-300 px-3 py-3 ">
            
            
            <td class="px-20 py-3 text-xl">
            <a href="{% url 'studentapp:std_detail' student.id %}" class="text-blue-500">{{ student.name }}</a>
            </td>
             <td class="px-20 py-3 text-md">{{ student.date }}</td>
            <td>
            <a href="#" class="text-blue-500 hover:text-blue-700 border border-blue-500 hover:bg-blue-500 hover:text-white px-2 py-1 rounded">Edit</a>
            <a href="#" class="text-red-500 hover:text-red-700 border border-red-500 hover:bg-red-500 hover:text-white px-2 py-1 rounded">Delete</a>
            </td>
            
        </tr>
        {% endfor %}
    </tbody>
{% endblock %}
